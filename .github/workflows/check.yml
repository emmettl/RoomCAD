    runs-on: [self-hosted, macOS, ARM64, metal, roomcad]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify complete current application CPU binding and repeated timings
        run: bash Scripts/check-wave-production-cpu.sh "${{ runner.temp }}/production-cpu-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Independently require complete output and generator evidence
        run: python3 Scripts/verify-wave-production-output.py "${{ runner.temp }}/production-cpu-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete production evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-cpu-${{ github.run_id }}-${{ github.run_attempt }}
