name: Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roomcad-metal
  cancel-in-progress: false

jobs:
  check:
    runs-on: [self-hosted, macOS, ARM64, metal, roomcad]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify standalone application on the Mac mini
        env:
          ROOMCAD_CI_OUTPUT_DIR: ${{ runner.temp }}/roomcad-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash Scripts/ci-check.sh
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roomcad-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/roomcad-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
