      - name: Verify complete original shared and actual-default Metal outputs and repeated timings
        run: bash Scripts/check-wave-production-metal.sh "${{ runner.temp }}/production-metal-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Independently require complete outputs actual GPU generator and saved response
        run: python3 Scripts/verify-wave-metal-production-output.py "${{ runner.temp }}/production-metal-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete Metal production evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-metal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-metal-${{ github.run_id }}-${{ github.run_attempt }}
