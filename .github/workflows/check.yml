      - name: Verify cylinder-domain CPU and Metal fields
        run: bash Scripts/check-cylinder.sh "${{ runner.temp }}/cylinder-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Require complete matching staggered fields from both backends
        run: |
          python3 Scripts/verify-cylinder-output.py "${{ runner.temp }}/cylinder-${{ github.run_id }}-${{ github.run_attempt }}/cpu"
          python3 Scripts/verify-cylinder-output.py "${{ runner.temp }}/cylinder-${{ github.run_id }}-${{ github.run_attempt }}/metal"
      - name: Retain cylinder conformance, occupancy and connectivity fields
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  admittance:
    if: github.event_name != 'workflow_dispatch' || (inputs.suite == 'all' || inputs.suite == 'affine-adoption') || inputs.suite == 'admittance'
    runs-on: [self-hosted, macOS, ARM64, metal, roomcad]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit actual wall admittance and isolated CPU Metal flow
        run: bash Scripts/check-admittance.sh "${{ runner.temp }}/admittance-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Require complete matching staggered fields from both backends
        run: |
          python3 Scripts/verify-admittance-output.py "${{ runner.temp }}/admittance-${{ github.run_id }}-${{ github.run_attempt }}/cpu"
          python3 Scripts/verify-admittance-output.py "${{ runner.temp }}/admittance-${{ github.run_id }}-${{ github.run_attempt }}/metal"
      - name: Retain admittance conformance, occupancy and connectivity fields
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admittance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admittance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  absorbing-cylinder:
    if: github.event_name != 'workflow_dispatch' || (inputs.suite == 'all' || inputs.suite == 'affine-adoption') || inputs.suite == 'absorbing-cylinder'
    runs-on: [self-hosted, macOS, ARM64, metal, roomcad]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify coupled absorbing-cylinder CPU and Metal fields and wall work
        run: bash Scripts/check-absorbing-cylinder.sh "${{ runner.temp }}/absorbing-cylinder-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Require complete all-step wall traces and native fields
        run: |
          python3 Scripts/verify-absorbing-cylinder-output.py "${{ runner.temp }}/absorbing-cylinder-${{ github.run_id }}-${{ github.run_attempt }}/cpu"
          python3 Scripts/verify-absorbing-cylinder-output.py "${{ runner.temp }}/absorbing-cylinder-${{ github.run_id }}-${{ github.run_attempt }}/metal"
      - name: Retain complete coupled source fields and work
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: absorbing-cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/absorbing-cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  tilted-pulse:
    if: github.event_name != 'workflow_dispatch' || (inputs.suite == 'all' || inputs.suite == 'affine-adoption') || inputs.suite == 'tilted-pulse'
    runs-on: [self-hosted, macOS, ARM64, metal, roomcad]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify actual plan and thin-mesh pulse fields, echo and work
        run: bash Scripts/check-tilted-pulse.sh "${{ runner.temp }}/tilted-pulse-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Require complete native fields, causal norms and stepwise work
        run: |
          python3 Scripts/verify-tilted-pulse-output.py "${{ runner.temp }}/tilted-pulse-${{ github.run_id }}-${{ github.run_attempt }}/cpu"
          python3 Scripts/verify-tilted-pulse-output.py "${{ runner.temp }}/tilted-pulse-${{ github.run_id }}-${{ github.run_attempt }}/metal"
          python3 Scripts/verify-tilted-pulse-output.py "${{ runner.temp }}/tilted-pulse-${{ github.run_id }}-${{ github.run_attempt }}/mesh/cpu"
          python3 Scripts/verify-tilted-pulse-output.py "${{ runner.temp }}/tilted-pulse-${{ github.run_id }}-${{ github.run_attempt }}/mesh/metal"
          python3 Scripts/verify-tilted-pulse-pair.py "${{ runner.temp }}/tilted-pulse-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete pulse source reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tilted-pulse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tilted-pulse-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  extruded-layout:
    if: github.event_name != 'workflow_dispatch' || (inputs.suite == 'all' || inputs.suite == 'affine-adoption') || inputs.suite == 'extruded-layout'
    runs-on: [self-hosted, macOS, ARM64, metal, roomcad]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit actual equivalent plan and extrusion geometry layouts
        run: bash Scripts/check-extruded-layout.sh "${{ runner.temp }}/extruded-layout-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete geometry arrays and explicit assignment gaps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extruded-layout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extruded-layout-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  shared-waves:
    # Deliberate source/shared adoption gate; existing app/source jobs remain unchanged.
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'shared-waves'
    runs-on: [self-hosted, macOS, ARM64, metal, roomcad]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual geometry with original and shared CPU/Metal steppers
        run: bash Scripts/check-shared-waves.sh all "${{ runner.temp }}/shared-waves-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Independently require every complete original/shared pair
        run: python3 Scripts/verify-shared-wave-pair.py "${{ runner.temp }}/shared-waves-${{ github.run_id }}-${{ github.run_attempt }}/original" "${{ runner.temp }}/shared-waves-${{ github.run_id }}-${{ github.run_attempt }}/shared" --output "${{ runner.temp }}/shared-waves-${{ github.run_id }}-${{ github.run_attempt }}/independent-comparison.json" --suites masked cylinder admittance absorbing-cylinder tilted-pulse
      - name: Retain complete source/shared fields, wall work and immutable reference provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-waves-${{ github.run_id }}-${{ github.run_attempt }}
