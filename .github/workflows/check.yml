          retention-days: 14

  production-metal:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'production-metal' || inputs.suite == 'fft-adoption' || inputs.suite == 'affine-adoption')
    runs-on: [self-hosted, macOS, ARM64, metal, roomcad]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
