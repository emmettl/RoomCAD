          fetch-depth: 0
          persist-credentials: false
      - name: Verify all-axis minimal-grid source and microphone streams on actual Metal
        run: bash Scripts/check-thin-probes.sh "${{ runner.temp }}/thin-probes-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Independently require complete addresses, streams and clock oracles
        run: python3 Scripts/verify-thin-probe-output.py "${{ runner.temp }}/thin-probes-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete minimal-grid evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thin-probes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/thin-probes-${{ github.run_id }}-${{ github.run_attempt }}
