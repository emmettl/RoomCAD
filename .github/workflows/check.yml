          path: ${{ runner.temp }}/rigid-3d-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  oblique:
    if: github.event_name != 'workflow_dispatch' || (inputs.suite == 'all' || inputs.suite == 'affine-adoption') || inputs.suite == 'oblique'
    runs-on: [self-hosted, macOS, ARM64, metal, roomcad]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify damped oblique CPU and Metal fields
        run: bash Scripts/check-oblique.sh "${{ runner.temp }}/oblique-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Require complete matching staggered fields from both backends
        run: |
          python3 Scripts/verify-oblique-output.py "${{ runner.temp }}/oblique-${{ github.run_id }}-${{ github.run_attempt }}/cpu"
          python3 Scripts/verify-oblique-output.py "${{ runner.temp }}/oblique-${{ github.run_id }}-${{ github.run_attempt }}/metal"
      - name: Retain oblique conformance, reflection and work fields
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
