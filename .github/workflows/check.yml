  fft-adoption:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'fft-adoption' || inputs.suite == 'fft-comparison' || inputs.suite == 'affine-adoption')
    runs-on: [self-hosted, macOS, ARM64, metal, roomcad]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare complete protected original and shared application FFT outputs
        run: bash Scripts/check-fft-adoption.sh "${{ runner.temp }}/fft-adoption-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain every native sample, source pin and complete case identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fft-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fft-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  fft-reference:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'fft-reference'
    runs-on: [self-hosted, macOS, ARM64, metal, roomcad]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable FFT compile control and all affected legacy wave consumers
        run: |
          set -euo pipefail
          python3 Scripts/verify-original-fft-reference.py --require-git
          python3 Scripts/test-original-fft-reference.py
          for suite in masked cylinder admittance absorbing-cylinder tilted-pulse; do
            bash "Scripts/check-$suite.sh" "${{ runner.temp }}/fft-reference-${{ github.run_id }}-${{ github.run_attempt }}/$suite"
          done
      - name: Retain complete legacy CPU/Metal fields with unchanged reference pins
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fft-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fft-reference-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  affine-capture:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'affine-capture' || inputs.suite == 'affine-adoption')
    runs-on: [self-hosted, macOS, ARM64, metal, roomcad]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture complete actual affine application traces and exact fit-only audit
        run: bash Scripts/capture-affine-adoption.sh "${{ runner.temp }}/affine-capture-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete raw windows predictions noise and calibration records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: affine-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affine-capture-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  affine-policy:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'affine-policy'
    runs-on: [self-hosted, macOS, ARM64, metal, roomcad]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Replay complete immutable actual affine histories and independent policies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output="${{ runner.temp }}/affine-policy-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$output"
          gh run download 38077531976 --repo emmettl/RoomCAD --name affine-capture-38077531976-1 --dir "$output/capture"
          python3 Scripts/verify-affine-adoption-output.py "$output/capture" 2>&1 | tee "$output/policy.log"
          python3 Scripts/test-affine-adoption-gate.py "$output/capture" 2>&1 | tee "$output/corruptions.log"
          git rev-parse HEAD > "$output/verifier-revision.txt"
          shasum -a 256 Scripts/verify-affine-adoption-output.py Scripts/test-affine-adoption-gate.py > "$output/verifier-sha256.txt"
      - name: Retain complete fields policy references and corruption evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: affine-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affine-policy-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
